<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --fg:#f3f3f6;--mute:rgba(243,243,246,.58);
  --accent:#b9c6ff;--accent-glow:rgba(185,198,255,.4);
  --line:rgba(255,255,255,.14);
  --glass:rgba(16,16,26,.42);--glass-strong:rgba(13,13,20,.62);
  --radius-lg:0;--radius-md:0;
  --font:'Noto Sans KR',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
*,*::before,*::after{border-radius:0!important}
::selection{background:rgba(185,198,255,.3)}
body{margin:0;min-height:100vh;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;background:#050507;overflow-x:hidden}

/* 배경 레이어 */
#bgLayer{position:fixed;inset:0;z-index:0;background-color:#05050a;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image .5s ease}

/* 별 */
#stars{position:fixed;inset:0;z-index:1;pointer-events:none}
#stars i{position:absolute;inset:0;animation:tw 5s ease-in-out infinite}
#stars i:nth-child(1){background-image:radial-gradient(1.5px 1.5px at 30px 40px,#fff,transparent),radial-gradient(1.2px 1.2px at 140px 90px,#dcdfff,transparent),radial-gradient(1.6px 1.6px at 210px 200px,#fff,transparent);background-size:260px 260px}
#stars i:nth-child(2){background-image:radial-gradient(1.2px 1.2px at 70px 150px,#fff,transparent),radial-gradient(1.8px 1.8px at 190px 30px,#ffffff,transparent);background-size:340px 340px;animation-duration:7s;animation-delay:-2s}
#stars i:nth-child(3){background-image:radial-gradient(1.2px 1.2px at 110px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 260px,#cfd6ff,transparent);background-size:430px 430px;animation-duration:9s;animation-delay:-4s}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){#stars i{animation:none;opacity:.35}}

/* 레이아웃 */
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:32px 22px 96px}
.glass-box{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 14px 44px -22px rgba(0,0,0,.55)}
#banner{height:clamp(150px,26vw,260px);margin-bottom:18px;cursor:pointer;background-size:cover;background-position:center;transition:border-color .3s,box-shadow .3s}
#banner:hover{border-color:rgba(255,255,255,.32);box-shadow:0 14px 44px -18px rgba(0,0,0,.55),0 0 0 1px var(--accent-glow) inset}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
aside{padding:14px}
main{padding:26px;min-height:420px}
main.glass-box{background:rgba(10,10,18,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
ul{list-style:none;margin:0 0 10px;padding:0}
@media(max-width:780px){.layout{grid-template-columns:1fr}main{padding:18px}}

/* 항목 + 호버 아이콘 */
.item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .2s,box-shadow .2s}
.item:hover{background:rgba(255,255,255,.05)}
.item.on{background:rgba(255,255,255,.08);box-shadow:inset 2px 0 0 #fff,0 0 16px -4px rgba(255,255,255,.6);color:#fff;text-shadow:0 0 8px rgba(255,255,255,.4)}
.nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:inline-flex;gap:2px;opacity:0;transition:opacity .2s}
.hov:hover .acts,.acts:focus-within{opacity:1}
@media(hover:none){.acts{opacity:.7}}
.hov:has(.inl) .acts{display:none}
.acts button{background:none;border:0;padding:0;width:20px;height:20px;line-height:20px;text-align:center;font-size:14px;cursor:pointer;color:var(--mute);transition:color .2s}
.acts button:hover{color:var(--accent)}
.acts .del:hover{color:#ff9c9c}
.item .date{margin-left:auto}
.inl{font:inherit;color:inherit;letter-spacing:inherit;background:transparent;border:0;border-bottom:1px solid var(--accent);outline:none;padding:0;width:min(320px,70vw)}
.item .inl{width:100%}
.item:has(.inl) .nm{flex:1;overflow:visible}

/* 텍스트 버튼 */
.tb{background:none;border:0;padding:4px 2px;font:inherit;font-size:13px;letter-spacing:.03em;color:var(--mute);cursor:pointer;transition:color .2s}
.tb:hover{color:#fff;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--accent)}
.tb:focus-visible,.ic:focus-visible,.acts button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
aside .tb{margin:6px 0 0 12px}

/* 본문 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.bar .hd{margin:0;font-size:1.15rem;font-weight:500;letter-spacing:.04em}
.mute,.date{color:var(--mute)}
.date{font-size:12px;white-space:nowrap}
.ptitle{font-size:1.6rem;font-weight:500;line-height:1.4;margin:.2em 0 .1em}
.rich{max-width:72ch}
.rich p{margin:.7em 0}
.rich blockquote{margin:1em 0;padding:.1em 1em;border-left:2px solid var(--accent);color:#cfcfd6}
.rich a{color:var(--accent);text-decoration:underline}
.rich ul,.rich ol{padding-left:1.4em;margin:.7em 0}
.rich ul{list-style:disc}

/* 에디터 */
.ttl{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;font:500 1.4rem var(--font);padding:6px 0 10px;outline:none;transition:border-color .2s,box-shadow .2s}
.ttl:focus{border-color:var(--accent);box-shadow:0 8px 14px -12px var(--accent-glow)}
.tools{display:flex;flex-wrap:wrap;gap:2px;margin:14px 0 8px}
.ic{background:none;border:0;width:32px;height:30px;display:grid;place-items:center;color:var(--mute);cursor:pointer;border-radius:8px;transition:color .2s,background .2s}
.ic:hover{color:var(--accent);background:rgba(255,255,255,.05)}
.editor{max-width:none;min-height:260px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:rgba(0,0,0,.22);outline:none;transition:border-color .2s,box-shadow .2s}
.editor:focus{border-color:var(--accent);box-shadow:0 0 16px -4px var(--accent-glow)}
.editor:empty::before{content:attr(data-ph);color:rgba(234,234,234,.35)}
.foot{display:flex;gap:20px;margin-top:16px}

/* 설정 버튼 */
#settingsBtn{position:fixed;left:18px;bottom:18px;z-index:5;width:36px;height:36px;display:grid;place-items:center;background:none;border:0;padding:0;color:var(--mute);cursor:pointer;transition:color .25s,transform .5s ease,filter .25s}
#settingsBtn:hover{color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.65));transform:rotate(65deg)}
#settingsBtn svg{width:22px;height:22px;display:block}

/* 설정 모달 */
#settingsOverlay{position:fixed;inset:0;z-index:20;background:rgba(4,4,8,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px}
#settingsOverlay.open{display:flex}
#settingsModal{width:min(460px,100%);max-height:86vh;overflow-y:auto;background:var(--glass-strong);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:22px;padding:26px 26px 22px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.mHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mHead .t{font-size:1.05rem;font-weight:500;letter-spacing:.04em}
#closeSettings{background:none;border:0;color:var(--mute);width:26px;height:26px;display:grid;place-items:center;cursor:pointer;border-radius:50%;transition:color .2s,background .2s}
#closeSettings:hover{color:#fff;background:rgba(255,255,255,.08)}
.setSec{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.setSec:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
.setLbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
select.sel{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);font:14px/1.4 var(--font);padding:9px 10px;border-radius:10px;outline:none;cursor:pointer;transition:border-color .2s}
select.sel:focus{border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.swatch{width:56px;height:40px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center;cursor:pointer;transition:border-color .2s,transform .2s}
.swatch:hover{transform:translateY(-2px)}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.urlRow{display:flex;gap:8px;margin-top:2px}
.urlRow input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);font:13px var(--font);padding:8px 10px;border-radius:10px;outline:none;transition:border-color .2s}
.urlRow input[type=text]:focus{border-color:var(--accent)}
.fileLbl{display:inline-block;margin-top:10px}
.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.toggleRow span{font-size:13px;color:var(--mute)}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:999px;cursor:pointer;transition:background .25s}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#eee;border-radius:50%;transition:transform .25s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(18px);background:#fff}
.dataRow{display:flex;gap:20px;flex-wrap:wrap}

/* GIF 커서 팔로워 */
#cursorFollow{position:fixed;left:0;top:0;z-index:9999;max-width:40px;max-height:40px;width:auto;height:auto;pointer-events:none;display:none;transform:translate(-4px,-4px)}

/* BGM 미니 플레이어 (카세트 카드 · 반투명 화이트 글래스) */
#bgmPlayer{position:fixed;left:18px;bottom:64px;z-index:15;width:min(252px,88vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:20px 14px 12px;cursor:grab;user-select:none;touch-action:none;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.38);
  border-radius:18px!important;
  box-shadow:0 10px 30px -14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
#bgmPlayer.dragging{cursor:grabbing}
/* 카세트 나사 */
#bgmPlayer::before{content:'';position:absolute;top:7px;left:11px;width:5px;height:5px;background:rgba(255,255,255,.75);border-radius:50%!important;pointer-events:none}

/* 접기 버튼(오른쪽 위) / 접힌 상태의 작은 음악 아이콘 */
.bgmFold{position:absolute;top:3px;right:8px;width:18px;height:18px;display:grid;place-items:center;padding:0;color:#fff;background:none;border:0;border-radius:50%!important;cursor:pointer;transition:background .2s}
.bgmFold:hover{background:rgba(255,255,255,.26)}
.bgmFold:focus-visible,.bgmOpen:focus-visible{outline:1px solid #fff;outline-offset:2px}
.bgmOpen{display:none;width:100%;height:100%;padding:0;place-items:center;color:#fff;background:none;border:0;border-radius:50%!important;cursor:pointer}
.bgmOpen svg{width:20px;height:20px}
#bgmPlayer.mini{width:44px;height:44px;padding:0;gap:0;align-items:center;justify-content:center;border-radius:50%!important}
#bgmPlayer.mini::before{display:none}
#bgmPlayer.mini > :not(.bgmOpen){display:none}
#bgmPlayer.mini .bgmOpen{display:grid}

/* 상단: 제목 라벨 + 전광판 흐름 */
.bgmLabel{padding:4px 10px;overflow:hidden;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);border-radius:9px!important}
.bgmTitleWrap{display:block;overflow:hidden;text-align:center;line-height:1.5}
.bgmTitleWrap.scroll{text-align:left;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}
.bgmTrack{display:inline-flex;white-space:nowrap}
.bgmTitle{flex:0 0 auto;display:inline-block;font-size:12px;letter-spacing:.02em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#bgmTitleClone{display:none}
.bgmTitleWrap.scroll .bgmTitle{padding-right:28px}
.bgmTitleWrap.scroll #bgmTitleClone{display:inline-block}
.bgmTitleWrap.scroll .bgmTrack{animation:bgmMarquee var(--dur,10s) linear infinite}
@keyframes bgmMarquee{from{transform:translateX(0)}to{transform:translateX(calc(var(--dist,0px) * -1))}}

/* 중앙: 원형 버튼 */
.bgmCtrls{display:flex;align-items:center;justify-content:center;gap:12px}
.bgmBtn{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;padding:0;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);border-radius:50%!important;cursor:pointer;transition:background .2s,transform .15s}
.bgmBtn:hover{background:rgba(255,255,255,.34)}
.bgmBtn:active{transform:scale(.92)}
.bgmBtn:focus-visible{outline:1px solid #fff;outline-offset:2px}
#bgmToggle{width:40px;height:40px}
#bgmToggle svg{width:16px;height:16px}
#bgmPlayer.playing #bgmToggle{background:rgba(255,255,255,.36)}

/* 하단: 음량 */
.bgmVolRow{display:flex;align-items:center;gap:8px}
#bgmVol{width:24px;height:24px;background:none;border-color:transparent}
#bgmVol:hover{background:rgba(255,255,255,.22)}
.bgmRange{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:14px;margin:0;cursor:pointer;outline:none;
  background:linear-gradient(90deg,#fff var(--v,60%),rgba(255,255,255,.32) var(--v,60%)) center/100% 3px no-repeat}
.bgmRange::-webkit-slider-runnable-track{height:14px;background:transparent}
.bgmRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin-top:1px;background:#fff;border:0;border-radius:50%!important;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 1px 4px rgba(0,0,0,.4)}
.bgmRange::-moz-range-track{height:14px;background:transparent}
.bgmRange::-moz-range-thumb{width:12px;height:12px;background:#fff;border:0;border-radius:50%!important}
#bgmHost{position:fixed;left:0;bottom:0;width:200px;height:200px;overflow:hidden;opacity:0;pointer-events:none;z-index:-1}
#bgmHost iframe{position:absolute;left:0;top:0;width:200px;height:200px;border:0}

/* 반짝이 트레일 */
.sparkle{position:fixed;left:0;top:0;z-index:9;border-radius:50%;pointer-events:none;animation:sparkleFall .85s ease-out forwards}
@keyframes sparkleFall{
  0%{opacity:.95;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15)}
}
</style>
</head>
<body>
<style id="cursorRuleTag"></style>
<div id="bgLayer"></div>
<img id="cursorFollow" alt="">

<div id="bgmPlayer" class="glass-box" title="드래그해서 위치를 옮길 수 있어요" aria-label="배경 음악 플레이어">
  <button type="button" class="bgmFold" id="bgmFold" title="접기" aria-label="플레이어 접기">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
  </button>
  <button type="button" class="bgmOpen" id="bgmOpen" title="음악 플레이어 열기" aria-label="음악 플레이어 열기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
  </button>
  <div class="bgmLabel">
    <span class="bgmTitleWrap"><span class="bgmTrack"><span class="bgmTitle" id="bgmTitle">재생목록 불러오는 중…</span><span class="bgmTitle" id="bgmTitleClone" aria-hidden="true"></span></span></span>
  </div>
  <div class="bgmCtrls">
    <button type="button" class="bgmBtn" id="bgmPrev" title="이전 곡" aria-label="이전 곡">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 5h2v14H6zM20 5L9 12l11 7z"/></svg>
    </button>
    <button type="button" class="bgmBtn" id="bgmToggle" title="재생" aria-label="재생">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <button type="button" class="bgmBtn" id="bgmNext" title="다음 곡" aria-label="다음 곡">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
    </button>
  </div>
  <div class="bgmVolRow">
    <button type="button" class="bgmBtn" id="bgmVol" title="음소거" aria-label="음소거">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 010 7"/></svg>
    </button>
    <input type="range" id="bgmRange" class="bgmRange" min="0" max="100" value="60" aria-label="볼륨">
  </div>
</div>
<div id="bgmHost"><div id="bgmSlotA"></div><div id="bgmSlotB"></div></div>

<div id="stars"><i></i><i></i><i></i></div>

<div class="wrap">
  <div id="banner" class="glass-box"></div>
  <div class="layout">
    <aside class="glass-box">
      <ul id="cats"></ul>
      <button type="button" class="tb" id="addCat">카테고리 추가</button>
    </aside>
    <main class="glass-box" id="main"></main>
  </div>
</div>

<button type="button" id="settingsBtn" aria-label="설정 열기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.3"/>
    <line x1="12" y1="1.5" x2="12" y2="4.5"/>
    <line x1="12" y1="19.5" x2="12" y2="22.5"/>
    <line x1="1.5" y1="12" x2="4.5" y2="12"/>
    <line x1="19.5" y1="12" x2="22.5" y2="12"/>
    <line x1="4.5" y1="4.5" x2="6.6" y2="6.6"/>
    <line x1="17.4" y1="17.4" x2="19.5" y2="19.5"/>
    <line x1="4.5" y1="19.5" x2="6.6" y2="17.4"/>
    <line x1="17.4" y1="6.6" x2="19.5" y2="4.5"/>
  </svg>
</button>

<div id="settingsOverlay">
  <div id="settingsModal" role="dialog" aria-modal="true" aria-label="설정">
    <div class="mHead">
      <span class="t">설정</span>
      <button type="button" id="closeSettings" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="setSec">
      <span class="setLbl">폰트</span>
      <select class="sel" id="fontSel">
        <option value="noto">Noto Sans KR</option>
        <option value="pretendard">Pretendard</option>
        <option value="gowunBatang">Gowun Batang (고운바탕)</option>
        <option value="gowunDodum">Gowun Dodum (고운돋움)</option>
        <option value="gaegu">Gaegu (개구체)</option>
      </select>
    </div>

    <div class="setSec">
      <span class="setLbl">배경 이미지</span>
      <div class="swatches" id="bgSwatches"></div>
      <div class="urlRow">
        <input type="text" id="bgUrlInput" placeholder="이미지 URL 입력">
        <button type="button" class="tb" id="bgUrlApply">적용</button>
      </div>
      <label class="tb fileLbl" for="bgFile">파일 업로드</label>
      <input type="file" id="bgFile" accept="image/*" hidden>
    </div>

    <div class="setSec">

<script>
const KEY = 'space-archive-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const $ = s => document.querySelector(s);
const iso = d => `2026-09-${d}T09:00:00.000Z`;

const BG_PRESETS = [
  { id: 'planet', label: '행성', url: 'https://images.unsplash.com/photo-1655509206649-a63396bed840?auto=format&fit=crop&w=2400&q=80' },
  { id: 'aurora', label: '오로라', url: 'https://images.unsplash.com/photo-1560185678-759b5712a60e?auto=format&fit=crop&w=2400&q=80' },
  { id: 'nebula', label: '네뷸라', url: 'https://images.unsplash.com/photo-1528819027803-5473f2bf7633?auto=format&fit=crop&w=2400&q=80' }
];
const FONTS = {
  noto: "'Noto Sans KR', sans-serif",
  pretendard: "'Pretendard', sans-serif",
  gowunBatang: "'Gowun Batang', serif",
  gowunDodum: "'Gowun Dodum', sans-serif",
  gaegu: "'Gaegu', cursive"
};
const STAR_CURSOR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><path d="M15 1c0 8 1 9 9 9-8 0-9 1-9 9 0-8-1-9-9-9 8 0 9-1 9-9z" fill="#ffffff" stroke="#00000066" stroke-width="1" stroke-linejoin="round"/></svg>`;
const CURSORS = {
  default: 'auto',
  crosshair: 'crosshair',
  star: `url('data:image/svg+xml,${encodeURIComponent(STAR_CURSOR_SVG)}') 15 15, auto`
};
const CURSOR_KEYS = ['default', 'crosshair', 'star', 'gif'];

let database = {
  config: { siteTitle: "나만의 우주 아카이브", bannerImage: "", background: "", font: "noto", cursor: "default", cursorGif: "", sparkle: false },
  categories: [
    { id: 'c1', name: '우주 일지', posts: [
      { id: 'p1', title: '첫 번째 항해', date: iso(21), content: '<p><b>환영합니다</b></p><p>이곳은 나만의 우주 아카이브입니다. 기록하고 싶은 생각과 관측을 별처럼 하나씩 남겨보세요.</p><blockquote>천천히, 그러나 멈추지 않고.</blockquote>' },
      { id: 'p2', title: '사용 안내', date: iso(20), content: '<p>배너 영역을 클릭하면 이미지 URL을 지정할 수 있습니다.</p><ul><li>항목 위에 마우스를 올리면 수정(✎)과 삭제(×) 아이콘이 나타납니다.</li><li>왼쪽 아래 톱니바퀴 아이콘에서 폰트, 배경, 커서 효과를 바꿀 수 있습니다.</li></ul>' }
    ]},
    { id: 'c2', name: '관측 노트', posts: [
      { id: 'p3', title: '밤하늘 관측 체크리스트', date: iso(19), content: '<ol><li>달의 위상 확인</li><li>구름과 광공해 점검</li><li>망원경 정렬</li></ol>' }
    ]},
    { id: 'c3', name: '아이디어', posts: [] }
  ]
};

const norm = d => {
  if (!d || !d.config || !Array.isArray(d.categories)) return null;
  d.categories.forEach(c => {
    c.id = c.id || uid(); c.name = c.name || '이름 없음';
    c.posts = Array.isArray(c.posts) ? c.posts : [];
    c.posts.forEach(p => { p.id = p.id || uid(); p.title = p.title || '제목 없음'; p.content = p.content || ''; });
  });
  d.config.siteTitle = d.config.siteTitle || '나만의 우주 아카이브';
  d.config.bannerImage = d.config.bannerImage || '';
  d.config.background = d.config.background || '';
  d.config.font = FONTS[d.config.font] ? d.config.font : 'noto';
  d.config.cursor = CURSOR_KEYS.includes(d.config.cursor) ? d.config.cursor : 'default';
  d.config.cursorGif = d.config.cursorGif || '';
  d.config.sparkle = !!d.config.sparkle;
  return d;
};
try { database = norm(JSON.parse(localStorage.getItem(KEY))) || database; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(database)); return true; } catch (e) { return false; } };

/* ---- 이미지 저장소 (IndexedDB, 대용량용) ----
   글 내용의 텍스트/서식은 그대로 localStorage(=database)에 저장하고,
   게시글에 삽입한 실제 이미지 파일(바이너리)은 훨씬 큰 저장 한도를 가진
   IndexedDB에 별도로 저장한다. 글 본문에는 <img data-img-id="..."> 형태의
   참조만 남기고, 화면에 그릴 때 IndexedDB에서 불러와 채워 넣는다. */
const IDB_NAME = 'space-archive-images', IDB_STORE = 'images';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(id, blob) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(blob, id);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(id);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}
async function idbDelete(id) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
async function idbClearAll() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
async function idbAllEntries() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const store = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE);
    const out = []; const req = store.openCursor();
    req.onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } else resolve(out); };
    req.onerror = () => reject(req.error);
  });
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result); r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}
function extractImgIds(html) {
  const t = document.createElement('template'); t.innerHTML = html || '';
  return [...t.content.querySelectorAll('img[data-img-id]')].map(n => n.getAttribute('data-img-id'));
}
async function resolveImages(container) {
  for (const img of [...container.querySelectorAll('img[data-img-id]')]) {
    const id = img.getAttribute('data-img-id');
    try {
      const blob = await idbGet(id);
      if (blob) img.src = URL.createObjectURL(blob);
      else { img.alt = '(이미지를 찾을 수 없음)'; img.style.opacity = '.35'; }
    } catch (e) { img.alt = '(이미지 로드 실패)'; }
  }
}

let st = { cat: database.categories[0]?.id || null, post: null, mode: 'list' };
const cat = () => database.categories.find(c => c.id === st.cat);
const post = () => cat()?.posts.find(p => p.id === st.post);
const fmt = s => new Date(s).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });

function el(tag, a = {}, ...kids) {
  const n = document.createElement(tag);
  for (const k in a) {
    if (k === 'class') n.className = a[k];
    else if (k === 'text') n.textContent = a[k];
    else if (k.startsWith('on')) n[k] = a[k];
    else n.setAttribute(k, a[k]);
  }
  n.append(...kids);
  return n;
}

function clean(html) {
  const t = document.createElement('template');
  t.innerHTML = html;
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(n => n.remove());
  t.content.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*(javascript|data):/i.test(a.value))) n.removeAttribute(a.name);
  }));
  // data-img-id 이미지는 항상 IndexedDB에서 새로 불러와 채우므로, 저장 시점의
  // blob: 미리보기 주소는 지운다 (재시작 후에는 어차피 무효한 주소라서).
  t.content.querySelectorAll('img[data-img-id]').forEach(n => n.removeAttribute('src'));
  return t.innerHTML;
}

function inline(host, val, ok) {
  const i = el('input', { class: 'inl', value: val, maxlength: 40 });
  host.replaceChildren(i); i.focus(); i.select();
  let done = false;
  const end = v => { if (done) return; done = true; if (v !== null && v.trim()) ok(v.trim()); render(); };
  i.onkeydown = e => { if (e.key === 'Enter') end(i.value); if (e.key === 'Escape') end(null); };
  i.onblur = () => end(i.value);
  i.onclick = e => e.stopPropagation();
}

const acts = (onEdit, onDel, label) => el('span', { class: 'acts' },
  el('button', { type: 'button', title: '수정', 'aria-label': label + ' 수정', text: '✎', onclick: e => { e.stopPropagation(); onEdit(); } }),
  el('button', { type: 'button', class: 'del', title: '삭제', 'aria-label': label + ' 삭제', text: '×', onclick: e => { e.stopPropagation(); onDel(); } }));

/* 렌더링 */
function render() {
  $('#banner').style.backgroundImage = database.config.bannerImage ? `url(${JSON.stringify(database.config.bannerImage)})` : 'none';
  renderSide(); renderMain();
}

function renderSide() {
  const ul = $('#cats'); ul.replaceChildren();
  database.categories.forEach(c => {
    const nm = el('span', { class: 'nm', text: c.name });
    ul.append(el('li', { class: 'item hov' + (c.id === st.cat ? ' on' : ''), onclick: () => { st = { cat: c.id, post: null, mode: 'list' }; render(); } },
      nm,
      acts(() => inline(nm, c.name, v => { c.name = v; save(); }), () => {
        if (!confirm(`'${c.name}' 카테고리와 모든 게시물을 삭제할까요?`)) return;
        c.posts.forEach(p => extractImgIds(p.content).forEach(id => idbDelete(id).catch(() => {})));
        database.categories = database.categories.filter(x => x !== c); save();
        if (st.cat === c.id) st = { cat: database.categories[0]?.id || null, post: null, mode: 'list' };
        render();
      }, c.name)));
  });
}

function renderMain() {
  const m = $('#main'); m.replaceChildren();
  const c = cat();
  if (!c) { m.append(el('p', { class: 'mute', text: '카테고리를 추가하면 게시물을 작성할 수 있습니다.' })); return; }
  if (st.mode === 'edit') return editor(m, c);
  if (st.mode === 'read' && post()) return reader(m, post());
  list(m, c);
}

function list(m, c) {
  m.append(el('div', { class: 'bar' }, el('div', { class: 'hd', text: c.name }),
    el('button', { type: 'button', class: 'tb', text: '게시물 추가', onclick: () => { st.post = null; st.mode = 'edit'; render(); } })));
  if (!c.posts.length) m.append(el('p', { class: 'mute', text: '게시물이 없습니다. 게시물 추가를 눌러 첫 글을 작성하세요.' }));
  c.posts.forEach(p => m.append(el('div', { class: 'item hov', onclick: () => { st.post = p.id; st.mode = 'read'; render(); } },
    el('span', { class: 'nm', text: p.title }),
    acts(() => { st.post = p.id; st.mode = 'edit'; render(); }, () => {
      if (!confirm(`'${p.title}' 게시물을 삭제할까요?`)) return;
      extractImgIds(p.content).forEach(id => idbDelete(id).catch(() => {}));
      c.posts = c.posts.filter(x => x !== p); save(); render();
    }, p.title),
    el('span', { class: 'date', text: fmt(p.date) }))));
}

function reader(m, p) {
  m.append(el('div', { class: 'bar' },
    el('button', { type: 'button', class: 'tb', text: '← 목록', onclick: () => { st.mode = 'list'; render(); } }),
    el('button', { type: 'button', class: 'tb', text: '수정', onclick: () => { st.mode = 'edit'; render(); } })));
  const body = el('div', { class: 'rich' });
  body.innerHTML = clean(p.content);
  body.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  resolveImages(body);
  m.append(el('div', { class: 'ptitle', text: p.title }), el('div', { class: 'date', text: fmt(p.date) }), body);
}

/* WYSIWYG 에디터 */
const TB = [
  ['bold', '굵게', '<path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/>'],
  ['italic', '기울임', '<path d="M19 4h-9M14 20H5M15 4L9 20"/>'],
  ['underline', '밑줄', '<path d="M7 4v7a5 5 0 0010 0V4M5 20h14"/>'],
  ['insertUnorderedList', '글머리 기호', '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'],
  ['insertOrderedList', '번호 목록', '<path d="M10 6h10M10 12h10M10 18h10M4 4.5l1.5-1v5M3.5 14.5h3l-3 3.5h3"/>'],
  ['blockquote', '인용', '<path d="M5 8h5v5a4 4 0 01-4 4M14 8h5v5a4 4 0 01-4 4"/>'],
  ['link', '링크', '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'],
  ['image', '이미지 삽입', '<rect x="3" y="4" width="18" height="16"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L6 20"/>'],
  ['removeFormat', '서식 지우기', '<path d="M5 5h14M12 5v8M9 19h6M4 4l16 16"/>']
];

function run(cmd, ed) {
  ed.focus();
  if (cmd === 'link') {
    const s = getSelection(), r = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
    const u = prompt('링크 URL을 입력하세요.', 'https://');
    if (!u) return;
    if (r) { s.removeAllRanges(); s.addRange(r); }
    return document.execCommand('createLink', false, u);
  }
  if (cmd === 'image') {
    const s = getSelection(), r = s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return;
      if (!f.type.startsWith('image/')) return alert('이미지 파일만 업로드할 수 있습니다.');
      const id = uid();
      try { await idbPut(id, f); }
      catch (e) { return alert('이미지 저장에 실패했습니다.'); }
      ed.focus();
      if (r) { s.removeAllRanges(); s.addRange(r); }
      const url = URL.createObjectURL(f);
      document.execCommand('insertHTML', false,
        `<img data-img-id="${id}" src="${url}" alt="" style="max-width:100%;display:block;margin:10px 0">`);
    };
    inp.click();
    return;
  }
  if (cmd === 'blockquote') {
    const cur = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    return document.execCommand('formatBlock', false, cur === cmd ? 'p' : cmd);
  }
  document.execCommand(cmd);
}

function editor(m, c) {
  const p = post();
  const t = el('input', { class: 'ttl', placeholder: '제목', maxlength: 80, value: p ? p.title : '' });
  const ed = el('div', { class: 'editor rich', contenteditable: 'true', 'data-ph': '내용을 입력하세요.' });
  ed.innerHTML = p ? clean(p.content) : '';
  resolveImages(ed);
  const tools = el('div', { class: 'tools' });
  TB.forEach(([cmd, label, d]) => {
    const b = el('button', { type: 'button', class: 'ic', title: label, 'aria-label': label, onmousedown: e => e.preventDefault(), onclick: () => run(cmd, ed) });
    b.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    tools.append(b);
  });
  m.append(t, tools, ed, el('div', { class: 'foot' },
    el('button', { type: 'button', class: 'tb', text: '저장', onclick: () => {
      const data = { title: t.value.trim() || '제목 없음', content: clean(ed.innerHTML), date: new Date().toISOString() };
      if (p) Object.assign(p, data); else { const n = { id: uid(), ...data }; c.posts.unshift(n); st.post = n.id; }
      save(); st.mode = 'read'; render();
    } }),
    el('button', { type: 'button', class: 'tb', text: '취소', onclick: () => { st.mode = p ? 'read' : 'list'; render(); } })));
  document.execCommand('defaultParagraphSeparator', false, 'p');
  (p ? ed : t).focus();
}

/* 배너 / 카테고리 추가 */
$('#banner').onclick = () => {
  const u = prompt('배너 이미지 URL을 입력하세요. (비워두면 초기화됩니다)', database.config.bannerImage);
  if (u === null) return;
  database.config.bannerImage = u.trim(); save(); render();
};
$('#addCat').onclick = () => {
  const nm = el('span', { class: 'nm' });
  $('#cats').append(el('li', { class: 'item' }, nm));
  inline(nm, '', v => { const c = { id: uid(), name: v, posts: [] }; database.categories.push(c); save(); st = { cat: c.id, post: null, mode: 'list' }; });
};

/* ===== 설정: 폰트 / 배경 / 커서 / 반짝이 / 백업 ===== */
function applyFont(key) { document.documentElement.style.setProperty('--font', FONTS[key] || FONTS.noto); }
function applyBg(url) { $('#bgLayer').style.backgroundImage = url ? `url("${url.replace(/"/g, '\\"')}")` : 'none'; }
function setCursorRule(val) {
  $('#cursorRuleTag').textContent = val ? `*{cursor:${val} !important}` : '';
  document.body.style.cursor = val || '';
}
function applyCursor(key) {
  const gifUrl = database.config.cursorGif;
  const follow = $('#cursorFollow');
  if (key === 'gif' && gifUrl) {
    follow.src = gifUrl;
    follow.style.display = 'block';
    setCursorRule('none');
  } else {
    follow.style.display = 'none';
    setCursorRule(key === 'default' ? '' : (CURSORS[key] || ''));
  }
}
document.addEventListener('mousemove', e => {
  const follow = $('#cursorFollow');
  if (follow.style.display === 'block') { follow.style.left = e.clientX + 'px'; follow.style.top = e.clientY + 'px'; }
});

let sparkleEnabled = false, lastSpark = 0;
function spawnSparkle(x, y) {
  const s = el('span', { class: 'sparkle' });
  const size = (2 + Math.random() * 3).toFixed(1);
  const dx = ((Math.random() - 0.5) * 36).toFixed(1) + 'px';
  const dy = (14 + Math.random() * 26).toFixed(1) + 'px';
  const color = Math.random() < 0.5 ? '#ffffff' : '#c9d4ff';
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.width = size + 'px'; s.style.height = size + 'px';
  s.style.setProperty('--dx', dx); s.style.setProperty('--dy', dy);
  s.style.background = color; s.style.boxShadow = `0 0 6px 1px ${color}`;
  s.addEventListener('animationend', () => s.remove());
  document.body.append(s);
}
document.addEventListener('mousemove', e => {
  if (!sparkleEnabled) return;
  const now = performance.now();
  if (now - lastSpark < 45) return;
  lastSpark = now;
  spawnSparkle(e.clientX, e.clientY);
});

function markActiveSwatch(url) {

}

$('#rs').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  f.text().then(async txt => {
    let raw; try { raw = JSON.parse(txt); } catch (_) {}
    if (!raw) return alert('올바른 백업 파일이 아닙니다.');
    const dbPart = raw && raw.database ? raw.database : raw; // 구버전 백업(이미지 없음)과도 호환
    const d = norm(dbPart);
    if (!d) return alert('올바른 백업 파일이 아닙니다.');
    if (!confirm('현재 데이터를 백업 파일의 내용으로 교체할까요? (삽입된 이미지 포함)')) return;
    try {
      await idbClearAll();
      const images = Array.isArray(raw.images) ? raw.images : [];
      for (const img of images) {
        if (!img || !img.id || !img.data) continue;
        const blob = await (await fetch(img.data)).blob();
        await idbPut(img.id, blob);
      }
    } catch (e) { alert('이미지 복원 중 일부 오류가 발생했습니다.'); }
    database = d; save();
    st = { cat: d.categories[0]?.id || null, post: null, mode: 'list' };
    render(); applySettings();
    $('#settingsOverlay').classList.remove('open');
  });
};

/* ---- BGM 미니 플레이어 (유튜브 재생목록) ----
   재생목록을 바꾸고 싶으면 아래 BGM_PLAYLIST_ID 값만 교체하면 됩니다.
   (유튜브 링크의 list=뒤에 붙는 부분, 예: ...&list=PLxxxxxxxx&... 에서 PLxxxxxxxx)
   유튜브의 "list=재생목록 통째로 불러오기" 방식이 불안정해서, 대신 YouTube Data API로
   재생목록 안의 영상 ID들을 직접 가져온 다음, 영상 하나하나를 개별로 재생하는 훨씬
   안정적인 방식을 씁니다. */
const BGM_PLAYLIST_ID = 'PLvUSTz7VttoOqzRWnoKt68XLSe0lFCW0r';
const YT_API_KEY = 'AIzaSyBS-I9MihM3hFl6YMQbGTN5y_1eWoV0fN0';
const BGM_POS_KEY = 'space-archive-bgm-pos';
const BGM_CACHE_KEY = 'space-archive-bgm-queue';
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4.5" width="4" height="15"/><rect x="14" y="4.5" width="4" height="15"/></svg>';
const ICON_VOL = $('#bgmVol').innerHTML;
const ICON_MUTE = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>';

let bgmPlayer = null, bgmReady = false, bgmQueue = [], bgmIndex = 0, bgmSkipAttempts = 0;
// 다음 곡을 미리 받아두는 대기용 플레이어 (다음 곡 버튼/자동 넘김 때 바로 교체해서 재생)
let bgmStandby = null, sbPlayerReady = false, sbIdx = -1, sbLoading = false, sbWarm = false, sbTimer = 0, bgmMuted = false, bgmT0 = 0;

(function loadYT() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => console.error('[BGM] 유튜브 API 스크립트 로드 실패 (네트워크/차단 문제일 수 있음)');
  document.head.appendChild(tag);
})();

const BGM_REGION = 'KR';
async function filterPlayable(items) {
  try {
    const ok = new Set();
    for (let i = 0; i < items.length; i += 50) {
      const ids = items.slice(i, i + 50).map(x => x.id).join(',');
      const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=status,contentDetails&id=${ids}&key=${YT_API_KEY}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      (data.items || []).forEach(v => {
        const embeddable = v.status && v.status.embeddable !== false;
        const rr = v.contentDetails && v.contentDetails.regionRestriction;
        const blocked = rr && ((rr.blocked && rr.blocked.includes(BGM_REGION)) || (rr.allowed && !rr.allowed.includes(BGM_REGION)));
        if (embeddable && !blocked) ok.add(v.id);
      });
    }
    const filtered = items.filter(x => ok.has(x.id));
    return filtered.length ? filtered : items;
  } catch (e) {
    console.warn('[BGM] 재생 가능 여부 확인 실패, 전체 목록 사용:', e.message);
    return items;
  }
}

async function fetchBgmQueue() {
  const items = [];
  let pageToken = '';
  try {
    do {
      const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${BGM_PLAYLIST_ID}&key=${YT_API_KEY}${pageToken ? '&pageToken=' + pageToken : ''}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'API error');
      (data.items || []).forEach(it => {
        const vid = it.snippet && it.snippet.resourceId && it.snippet.resourceId.videoId;
        if (vid) items.push({ id: vid, title: it.snippet.title || vid });
      });
      pageToken = data.nextPageToken || '';
    } while (pageToken);
    if (!items.length) throw new Error('재생목록이 비어있거나 접근할 수 없음');
    const playable = await filterPlayable(items);
    console.log(`[BGM] 재생목록 ${items.length}곡 중 재생 가능 ${playable.length}곡`);
    try { localStorage.setItem(BGM_CACHE_KEY, JSON.stringify({ ts: Date.now(), items: playable })); } catch (e) {}
    return playable;
  } catch (e) {
    console.warn('[BGM] 재생목록 API 불러오기 실패:', e.message, '— 캐시된 목록 시도');
    try {
      const cached = JSON.parse(localStorage.getItem(BGM_CACHE_KEY));
      if (cached && cached.items && cached.items.length) { console.log('[BGM] 캐시 사용:', cached.items.length, '곡'); return cached.items; }
    } catch (e2) {}
    return [];
  }
}

function cueBgmAt(i, autoplay) {
  if (!bgmReady || !bgmQueue.length) return;
  bgmIndex = ((i % bgmQueue.length) + bgmQueue.length) % bgmQueue.length;
  const track = bgmQueue[bgmIndex];
  $('#bgmTitle').textContent = track.title;
  if (autoplay && sbWarm && sbIdx === bgmIndex) {
    // 미리 받아둔 곡이 바로 이 곡이면 두 플레이어를 맞바꿔서 즉시 재생
    const old = bgmPlayer;
    bgmPlayer = bgmStandby; bgmStandby = old;
    sbWarm = false; sbLoading = false; sbIdx = -1;
    try { old.stopVideo(); } catch (e) {}
    bgmPlayer.setVolume(+$('#bgmRange').value);
    if (bgmMuted) bgmPlayer.mute(); else bgmPlayer.unMute();
    bgmPlayer.seekTo(0, true);
    bgmPlayer.playVideo();
    console.log('[BGM] 미리 받아둔 곡으로 즉시 전환');
    return;
  }
  if (autoplay) { bgmT0 = performance.now(); bgmPlayer.loadVideoById(track.id); }
  else bgmPlayer.cueVideoById(track.id);
}

// 지금 곡의 다음 곡을 대기 플레이어에 음소거로 미리 로드
function preloadNext() {
  if (!bgmReady || !sbPlayerReady || bgmQueue.length < 2) return;
  const idx = (bgmIndex + 1) % bgmQueue.length;
  if (sbIdx === idx) return;
  sbIdx = idx; sbWarm = false; sbLoading = true;
  try { bgmStandby.mute(); bgmStandby.loadVideoById(bgmQueue[idx].id); }
  catch (e) { sbLoading = false; sbIdx = -1; }
}

function makeBgmYT(slot, isMain) {
  return new YT.Player(slot, {
    width: 200, height: 200,
    events: {
      onReady: async e => {
        e.target.setVolume(+$('#bgmRange').value);
        if (!isMain) {
          sbPlayerReady = true;
          console.log('[BGM] standby player ready');
          if (bgmReady && bgmQueue.length && bgmPlayer.getPlayerState() === YT.PlayerState.PLAYING) preloadNext();
          return;
        }
        bgmReady = true;
        console.log('[BGM] player ready');
        bgmQueue = await fetchBgmQueue();
        if (bgmQueue.length) cueBgmAt(0, false);
        else $('#bgmTitle').textContent = '재생목록을 불러오지 못함';
      },
      onStateChange: e => {
        if (e.target !== bgmPlayer) {
          // 대기 플레이어: 미리 로드가 시작되면 일시정지해서 버퍼만 채워둠
          if (e.data === YT.PlayerState.PLAYING && sbLoading) {
            sbLoading = false; sbWarm = true; e.target.pauseVideo();
            console.log('[BGM] 다음 곡 미리 로드 완료');
          }
          return;
        }
        if (e.data === YT.PlayerState.PLAYING) {
          bgmSkipAttempts = 0;
          if (bgmT0) { console.log(`[BGM] 재생 시작까지 ${Math.round(performance.now() - bgmT0)}ms`); bgmT0 = 0; }
          clearTimeout(sbTimer); sbTimer = setTimeout(preloadNext, 2000);
        }
        if (e.data === YT.PlayerState.ENDED) cueBgmAt(bgmIndex + 1, true);
        onBgmState(e);
      },
      onError: e => {
        if (e.target !== bgmPlayer) {
          sbLoading = false; sbWarm = false; sbIdx = -1;
          console.warn(`[BGM] 다음 곡 미리 로드 실패 (코드 ${e.data})`);
          return;
        }
        // 100,101,150 등 = 이 곡만 재생 불가/임베드 금지 → 다음 곡으로 넘어감.
        // 153 같은 그 외 오류는 모든 곡에 똑같이 생기는 문제라, 넘기지 않고 멈춘 뒤 안내함.
        if (![2, 5, 100, 101, 150].includes(e.data)) {
          console.error(`[BGM] 재생 오류 (코드 ${e.data}) — 모든 곡에 공통으로 생기는 문제라 자동 넘김을 멈춥니다.`);
          $('#bgmTitle').textContent = e.data === 153 ? '유튜브가 이 열기 방식을 막고 있어요 (오류 153)' : `재생 오류 (코드 ${e.data})`;
          return;
        }
        bgmSkipAttempts++;
        console.warn(`[BGM] 재생 불가 트랙 (에러 코드 ${e.data}) — 넘긴 횟수: ${bgmSkipAttempts}`);
        if (bgmSkipAttempts > bgmQueue.length + 2) {
          $('#bgmTitle').textContent = '재생 가능한 곡을 찾지 못함';
          console.error('[BGM] 재생목록 전체가 임베드 제한된 것으로 보입니다.');
          return;
        }
        cueBgmAt(bgmIndex + 1, true);
      }
    }
  });
}

window.onYouTubeIframeAPIReady = function () {
  console.log('[BGM] YouTube API ready, creating players…');
  bgmPlayer = makeBgmYT('bgmSlotA', true);
  bgmStandby = makeBgmYT('bgmSlotB', false);
};
function onBgmState(e) {
  const S = YT.PlayerState;
  if (e.data === S.PLAYING) $('#bgmPlayer').classList.add('playing');
  else if (e.data === S.PAUSED || e.data === S.ENDED || e.data === S.CUED) $('#bgmPlayer').classList.remove('playing');
  if (e.data === YT.PlayerState.PLAYING) { $('#bgmToggle').innerHTML = ICON_PAUSE; $('#bgmToggle').title = '일시정지'; }
  else if (e.data === YT.PlayerState.PAUSED) { $('#bgmToggle').innerHTML = ICON_PLAY; $('#bgmToggle').title = '재생'; }
}
$('#bgmToggle').onclick = () => {
  if (!bgmReady || !bgmQueue.length) return;
  const s = bgmPlayer.getPlayerState();
  if (s === YT.PlayerState.PLAYING) bgmPlayer.pauseVideo();
  else if (s === YT.PlayerState.CUED || s === YT.PlayerState.PAUSED) bgmPlayer.playVideo();
  else cueBgmAt(bgmIndex, true);
};
$('#bgmPrev').onclick = () => cueBgmAt(bgmIndex - 1, true);
$('#bgmNext').onclick = () => cueBgmAt(bgmIndex + 1, true);
$('#bgmRange').oninput = e => { if (bgmReady) { bgmPlayer.setVolume(+e.target.value); if (sbPlayerReady) bgmStandby.setVolume(+e.target.value); } };
$('#bgmVol').onclick = () => {
  if (!bgmReady) return;
  bgmMuted = !bgmMuted;
  if (!bgmMuted) { bgmPlayer.unMute(); $('#bgmVol').innerHTML = ICON_VOL; $('#bgmVol').title = '음소거'; }
  else { bgmPlayer.mute(); $('#bgmVol').innerHTML = ICON_MUTE; $('#bgmVol').title = '음소거 해제'; }
};

/* 드래그로 위치 옮기기 + 위치 기억(localStorage) */
(function makeBgmDraggable() {
  const box = $('#bgmPlayer');
  function place(x, y) {
    const w = box.offsetWidth || 252, h = box.offsetHeight || 130;
    x = Math.max(6, Math.min(x, innerWidth - w - 6));
    y = Math.max(6, Math.min(y, innerHeight - h - 6));
    box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.bottom = 'auto';
  }
  let saved; try { saved = JSON.parse(localStorage.getItem(BGM_POS_KEY)); } catch (e) {}
  if (saved && typeof saved.x === 'number') requestAnimationFrame(() => place(saved.x, saved.y));

  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('button:not(.bgmOpen),input')) return;
    box.dataset.moved = '';
    dragging = true; box.classList.add('dragging');
    box.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
  });
  box.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 4) box.dataset.moved = '1';
    place(ox + (e.clientX - sx), oy + (e.clientY - sy));
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false; box.classList.remove('dragging');
    setTimeout(() => { box.dataset.moved = ''; }, 50);
    const r = box.getBoundingClientRect();
    localStorage.setItem(BGM_POS_KEY, JSON.stringify({ x: r.left, y: r.top }));
  }
  box.addEventListener('pointerup', endDrag);
  box.addEventListener('pointercancel', endDrag);
  addEventListener('resize', () => { const r = box.getBoundingClientRect(); place(r.left, r.top); });
})();

/* 제목 전광판: 제목이 잘릴 때만 왼쪽으로 끊김 없이 천천히 흘러감 */
(function bgmMarquee() {
  const wrap = document.querySelector('.bgmTitleWrap'), track = document.querySelector('.bgmTrack');
  const txt = $('#bgmTitle'), clone = $('#bgmTitleClone');
  const GAP = 28, SPEED = 32; // GAP: 반복되는 제목 사이 간격(px), SPEED: 초당 이동 거리(px)
  function measure() {
    clone.textContent = txt.textContent;
    wrap.classList.remove('scroll');
    const w = txt.offsetWidth;
    if (w > wrap.clientWidth + 1) {
      const dist = w + GAP;
      track.style.setProperty('--dist', dist + 'px');
      track.style.setProperty('--dur', (dist / SPEED).toFixed(1) + 's');
      void track.offsetWidth;            // 애니메이션 처음부터 다시 시작
      wrap.classList.add('scroll');
    }
  }
  new MutationObserver(measure).observe(txt, { childList: true, characterData: true, subtree: true });
  new ResizeObserver(measure).observe(wrap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();

/* 음량 슬라이더: 흰색으로 채워진 부분 표시 */
(function bgmVolumeFill() {
  const rng = $('#bgmRange');
  const setV = () => rng.style.setProperty('--v', rng.value + '%');
  rng.addEventListener('input', setV);
  setV();
})();

/* 플레이어 접기/펼치기 (상태 기억) */
(function bgmFold() {
  const box = $('#bgmPlayer'), MINI_KEY = 'space-archive-bgm-mini';
  function setMini(mini, notify) {
    box.classList.toggle('mini', mini);
    try { localStorage.setItem(MINI_KEY, mini ? '1' : '0'); } catch (e) {}
    if (notify) dispatchEvent(new Event('resize')); // 화면 밖으로 나가지 않게 위치 보정
  }
  $('#bgmFold').addEventListener('click', e => { e.stopPropagation(); setMini(true, true); });
  box.addEventListener('click', () => {
    if (box.classList.contains('mini') && box.dataset.moved !== '1') setMini(false, true);
  });
  let saved = null; try { saved = localStorage.getItem(MINI_KEY); } catch (e) {}
  if (saved === '1') setMini(true, false);
})();

applySettings();
render();
